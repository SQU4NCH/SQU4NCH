name: Latest blog post workflow

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:                                                                                                                                           

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Fetch RSS feed and update README.md
        run: |
          python3 - << 'EOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import re
          
          url = "https://squ4n.ch/feed.xml"
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          xml_data = urllib.request.urlopen(req).read()
           
          root = ET.fromstring(xml_data)
          items = root.findall('./channel/item')[:5]
          
          posts = []
          for item in items:
            title = item.find('title').text.strip()
            link = item.find('link').text.strip()
            if link.startswith('/'):
              link = f"https://squ4n.ch{link}"
            posts.append(f"- [{title}]({link})")
            
            new_content = "<!-- BLOG-POST-LIST:START -->\n" + "\n".join(posts) + "\n<!-- BLOG-POST-LIST:END -->"
            
            with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()
              
            updated_readme = re.sub(
              r"<!-- BLOG-POST-LIST:START -->.*?<!-- BLOG-POST-LIST:END -->",
              new_content,
              readme,
              flags=re.DOTALL
            )
            
            if updated_readme != readme:
              with open("README.md", "w", encoding="utf-8") as f:
                f.write(updated_readme)
            EOF
            
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update latest blog posts"
          git push
